<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindCapsule Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="mc-options">
    <header class="mc-header">
      <img src="../store-assets/icon48.png" class="mc-logo" alt="">
      <h1 data-i18n="settingsTitle">MindCapsule 设置</h1>
    </header>

    <form id="settingsForm" class="mc-form">
      <fieldset class="mc-fieldset">
        <legend data-i18n="langSettings">语言设置</legend>
        <div class="mc-field">
          <label for="uiLang" data-i18n="uiLang">界面语言</label>
          <select id="uiLang" name="uiLang">
            <option value="zh" data-i18n="uiLangZh">中文</option>
            <option value="en" data-i18n="uiLangEn">English</option>
          </select>
        </div>
        <div class="mc-field">
          <label for="outputLang" data-i18n="outputLang">生成语言</label>
          <select id="outputLang" name="outputLang">
            <option value="auto" data-i18n="outputLangAuto">跟随视频</option>
            <option value="zh" data-i18n="outputLangZh">中文</option>
            <option value="en" data-i18n="outputLangEn">English</option>
          </select>
        </div>
      </fieldset>

      <div class="mc-field">
        <label for="provider" data-i18n="provider">AI 服务商</label>
        <select id="provider" name="provider">
          <option value="siliconflow" data-i18n="siliconFlow">硅基流动</option>
          <option value="openai" data-i18n="openAI">OpenAI</option>
          <option value="custom_openai" data-i18n="customOpenAI">OpenAI 兼容接口</option>
        </select>
      </div>

      <div class="mc-field">
        <label for="apiKey" data-i18n="apiKey">API Key</label>
        <input type="password" id="apiKey" name="apiKey" placeholder="sk-..." autocomplete="off">
        <p class="mc-hint" data-i18n="apiKeyHint">密钥仅保存在本地，不会上传或共享。</p>
      </div>

      <div class="mc-field" id="endpointField" hidden>
        <label for="endpoint" data-i18n="endpoint">接口地址</label>
        <input type="url" id="endpoint" name="endpoint" placeholder="https://api.example.com/v1">
      </div>

      <div class="mc-field" id="modelField">
        <label for="model" data-i18n="model">模型</label>
        <input type="text" id="model" name="model" placeholder="Qwen/Qwen2.5-72B-Instruct">
      </div>

      <div class="mc-field" id="customModelField" hidden>
        <label for="customModel" data-i18n="customModel">自定义模型</label>
        <input type="text" id="customModel" name="customModel" placeholder="gpt-4o-mini">
      </div>

      <div class="mc-actions">
        <button type="submit" class="mc-btn mc-btn-primary" data-i18n="save">保存设置</button>
        <span id="saveStatus" class="mc-status"></span>
      </div>

      <a class="mc-support-link" id="supportAuthorBlock" role="button" tabindex="0" data-i18n="supportAuthor">支持作者</a>
    </form>
  </div>

  <div id="supportModal" class="mc-modal" hidden>
    <div class="mc-modal-backdrop" data-close="1"></div>
    <div class="mc-modal-box" role="dialog" aria-modal="true" aria-label="Support Author">
      <button type="button" class="mc-modal-close" data-close="1" aria-label="Close">&times;</button>
      <h2 class="mc-modal-title" data-i18n="supportAuthorTitle">支持作者</h2>
      <p class="mc-modal-sub" data-i18n="supportAuthorSub">你的支持是持续开发的动力，谢谢！</p>
      <div class="mc-support-options">
        <button type="button" class="mc-support-card" id="wechatTipBtn">
          <span class="mc-support-card-name" data-i18n="wechatTip">微信赞赏</span>
          <span class="mc-support-card-desc" data-i18n="wechatTipDesc">扫码使用微信赞赏码</span>
        </button>
        <a class="mc-support-card" id="paypalTipBtn" href="https://www.paypal.com/ncp/payment/BYP52XKB4DSKS" target="_blank" rel="noopener noreferrer">
          <span class="mc-support-card-name" data-i18n="paypalTip">PayPal 支持</span>
          <span class="mc-support-card-desc" data-i18n="paypalTipDesc">前往 PayPal 付款</span>
        </a>
      </div>
    </div>
  </div>

  <div id="qrModal" class="mc-modal" hidden>
    <div class="mc-modal-backdrop" data-close="2"></div>
    <div class="mc-modal-box mc-modal-box-qr" role="dialog" aria-modal="true" aria-label="WeChat QR">
      <button type="button" class="mc-modal-close" data-close="2" aria-label="Close">&times;</button>
      <h2 class="mc-modal-title" data-i18n="scanToTip">扫码赞赏</h2>
      <img id="wechatQr" class="mc-qr-img" src="../store-assets/%E5%BE%AE%E4%BF%A1%E8%B5%9E%E8%B5%8F%E7%A0%81.png" alt="WeChat tip QR code">
      <p class="mc-modal-sub" data-i18n="scanHint">使用微信扫一扫，赞赏作者</p>
    </div>
  </div>

  <script src="../shared/storage-keys.js"></script>
  <script src="../shared/constants.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
